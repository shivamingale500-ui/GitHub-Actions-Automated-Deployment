```yaml
name: Java Application Automated Deployment

on:
  push:
    branches:
      - main

# GitHub OIDC permissions
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: java-app
  ECS_CLUSTER: java-app-cluster
  ECS_SERVICE: java-app-service

jobs:

  # ==========================================
  # 1. BUILD AND TEST
  # ==========================================
  build-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test Maven application
        run: |
          mvn clean test package


  # ==========================================
  # 2. DEPLOY TO AWS
  # ==========================================
  deploy:

    needs: build-test

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # CHECKOUT SOURCE CODE
      # ----------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # ----------------------------------------
      # CONFIGURE AWS USING GITHUB OIDC
      # ----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ----------------------------------------
      # VERIFY AWS AUTHENTICATION
      # ----------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ----------------------------------------
      # LOGIN TO AMAZON ECR
      # ----------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ----------------------------------------
      # BUILD DOCKER IMAGE
      # ----------------------------------------
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .


      # ----------------------------------------
      # PUSH DOCKER IMAGE TO ECR
      # ----------------------------------------
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest


      # ----------------------------------------
      # DEPLOY TO ECS
      # ----------------------------------------
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment


      # ----------------------------------------
      # WAIT FOR ECS DEPLOYMENT
      # ----------------------------------------
      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"


      # ----------------------------------------
      # SUCCESS
      # ----------------------------------------
      - name: Deployment successful
        run: |
          echo "=========================================="
          echo "AWS AUTHENTICATION SUCCESSFUL"
          echo "ECR PUSH SUCCESSFUL"
          echo "ECS DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo "Commit: ${{ github.sha }}"
```

